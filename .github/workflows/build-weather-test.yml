name: Build Weather Source Test
on:
  push:
    branches: [feature/weather-source-test-app]
    paths:
      - 'weather-test/**'
      - '.github/workflows/build-weather-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check weather-test/src/pkjs/index.js
      - name: Install Pebble SDK
        run: |
          pipx install uv
          pipx install pebble-tool
          pebble sdk install latest
      - name: Build test PBW
        working-directory: weather-test
        run: pebble build
      - name: Bundle settings page into PBW
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          pbw=Path('weather-test/build/weather-test.pbw')
          with zipfile.ZipFile(pbw,'a',zipfile.ZIP_DEFLATED) as archive:
              archive.write('weather-test/config.html','config.html')
          with zipfile.ZipFile(pbw) as archive:
              assert 'config.html' in archive.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weather-source-test-pbw
          path: weather-test/build/*.pbw
          if-no-files-found: error
      - name: Publish direct PBW download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view weather-test-dev >/dev/null 2>&1; then
            gh release create weather-test-dev --title "Weather Source Test development" --notes "Experimental weather diagnostic watch app; built from feature/weather-source-test-app." --prerelease --target "${GITHUB_SHA}"
          fi
          gh release upload weather-test-dev weather-test/build/weather-test.pbw --clobber

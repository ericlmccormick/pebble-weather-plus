name: Build Weather+ Pebble plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pebble tooling
        run: |
          python -m pip install --user pebble-tool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Pebble SDK
        run: |
          pebble sdk install latest
      - name: Compile plugin
        run: pebble build
      - name: Verify build output
        run: |
          find build -type f -name '*.pbp' -print
          test "$(find build -type f -name '*.pbp' | wc -l)" -gt 0
          cp "$(find build -type f -name '*.pbp' | head -n 1)" weather-plus.pbp
      - name: Publish direct-download development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-latest >/dev/null 2>&1 || gh release create dev-latest --title "Latest development build" --notes "Automatically built from main. Development build; not a stable release." --prerelease
          gh release upload dev-latest weather-plus.pbp --clobber
